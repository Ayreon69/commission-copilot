# Démo complète en local : API sur http://localhost:8000, interface sur http://localhost:3000.
#   docker compose up --build
# La clé du modèle est lue dans .env (LLM_API_KEY). Sans clé, seul l'assistant est désactivé.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
