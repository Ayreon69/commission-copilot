[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commission-api"
version = "0.1.0"
description = "API du moteur de commissions et assistant conversationnel avec appel d'outils."
requires-python = ">=3.11"
dependencies = [
    "commission-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "mistralai>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["commission_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../engine", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
